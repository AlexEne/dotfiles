# Layout (looknfeel.lua: general/dwindle/master sections)

[layout]
# Hyprland: general.layout = "dwindle"
mode = "dwindle"
gap = 3
extent_presets = [0.333, 0.5, 0.667]

[layout.dwindle]
preserve_split = true

[layout.master]
# Hyprland: master.new_status = "master"
new_becomes_master = true

# Hyprland groups (SUPER+G, groupbar) are replaced by Umbriel tab groups.
# See keybinds-tiling.toml. Bar defaults below match the stock appearance;
# uncomment to tune.
# [appearance.tab_bar]
# style = "titles"
# position = "top"
# height = 22
# font = "monospace 10"
