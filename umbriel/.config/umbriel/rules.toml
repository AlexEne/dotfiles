# Window and layer rules (windows.lua)
# Umbriel has no tag system — each Hyprland tag group is expanded to regex
# rules on app_id/title. Regexes match any part by default; ^$ anchor exact.
# Inspect live values with: umbriel windows  /  umbriel layers
#
# NOT PORTED (no Umbriel equivalent):
#   - min_size/max_size rules (tui.btop 1920x1080, Blender 800x600,
#     Steam Friends List 300x300-600) — Umbriel respects client size hints only
#   - idle_inhibit (noidle tag) — use the Noctalia caffeine toggle instead
#   - no_focus fix for XWayland drag popups — xwayland-satellite handles this
#   - "pop" tag rounding — nothing can tag windows at runtime; corner_radius
#     is already 8 globally
#   - opacity 1.0 override rules — Umbriel windows are opaque by default

# Blur master switch is in appearance.toml, but surfaces must opt in.
# (Hyprland blurs all transparent windows; this reproduces that.)
# blur_optimized = false: optimized blur samples beneath the window stack
# only; the full path includes windows behind translucent ones.
[[window_rule]]
blur = true
blur_optimized = false

# ------------------------------------------------------------------------------
# Browsers (was tag chromium-based-browser + tile)

[[window_rule]]
match.app_id = '((google-)?[cC]hrom(e|ium)|[bB]rave-browser|[mM]icrosoft-edge|Vivaldi-stable|helium)'
default_floating = false

# ------------------------------------------------------------------------------
# Floating utility windows (was tag floating-window: float + center + 875x600)

[[window_rule]]
match.app_id = '(tui\.bluetui|tui\.impala|tui\.wiremix|tui\.btop|tui\.terminal|tui\.bash|org\.gnome\.NautilusPreviewer|org\.gnome\.Evince|com\.gabm\.satty|Omarchy|About|TUI\.float|imv|mpv)'
default_floating = true
default_position = { x = 0, y = 0, anchor = "center" }
default_floating_size_px = { width = 875, height = 600 }

# File-open/save dialogs (was tag floating-window)
[[window_rule]]
match.app_id = '(xdg-desktop-portal-gtk|sublime_text|DesktopEditors|org\.gnome\.Nautilus)'
match.title = '^(Open.*Files?|Open [F|f]older.*|Save.*Files?|Save.*As|Save|All Files|.*wants to [open|save].*|[C|c]hoose.*)'
default_floating = true
default_position = { x = 0, y = 0, anchor = "center" }
default_floating_size_px = { width = 875, height = 600 }

# Portal "File Upload" dialog (was tag floating-window)
[[window_rule]]
match.app_id = '^(xdg-desktop-portal-gtk)$'
match.title = '.*File Upload.*'
default_floating = true
default_position = { x = 0, y = 0, anchor = "center" }
default_floating_size_px = { width = 875, height = 600 }

# ------------------------------------------------------------------------------
# Calculator
[[window_rule]]
match.app_id = 'org\.gnome\.Calculator'
default_floating = true
default_floating_size_px = { width = 707, height = 747 }

# ------------------------------------------------------------------------------
# Dwarf Things
[[window_rule]]
match.app_id = 'dwarf_things'
default_floating = true

[[window_rule]]
match.title = 'Dwarf Things'
default_floating = true

# ------------------------------------------------------------------------------
# Steam

# Friends List (min/max size constraints are not portable, size only)
[[window_rule]]
match.app_id = 'steam'
match.title = 'Friends List'
default_floating_size_px = { width = 300, height = 600 }

# Main window: floating, centered, fixed size, never fullscreen
[[window_rule]]
match.app_id = '^steam$'
match.title = '^Steam$'
default_floating = true
default_floating_size_px = { width = 1670, height = 1086 }
default_position = { x = 0, y = 0, anchor = "center" }
default_fullscreen = false

# ------------------------------------------------------------------------------
# Noctalia settings window
[[window_rule]]
match.app_id = 'dev\.noctalia\.Noctalia'
default_floating = true
default_floating_size_px = { width = 1080, height = 920 }

# Umbriel share picker: floating, centered
[[window_rule]]
match.app_id = '^dev[.]noctalia[.]UmbrielSharePicker$'
default_floating = true
default_position = { x = 0, y = 0, anchor = "center" }
default_floating_size_px = { width = 800, height = 600 }

# ==============================================================================
# Layer rules

# Noctalia v5: blur shell surfaces. no_anim is covered globally by
# [animation.layers] enabled = false (animation.toml); Umbriel has no
# per-namespace animation rules.
# [[layer_rule]]
# match.namespace = '^noctalia-(bar-.+|notification|dock|panel|attached-panel|osd|window-switcher)$'
# # blur = true
# # blur_ignore_alpha = 0.5
# blur_popups = true
# # Optimized blur samples beneath the window stack, missing the wallpaper
# # layer under shell surfaces — the packaged Umbriel example disables it here.
# blur_optimized = true

[[layer_rule]]
match.namespace = '^noctalia-(bar-.+|notification|dock|panel|attached-panel|osd|window-switcher)$'
blur = true
blur_ignore_alpha = 0.7
blur_popups = true
blur_optimized = false

# walker: layerrule no_anim — covered by the global layers setting above.
