# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, E, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT, Z, Toggle Microphone Mute, exec, qs ipc -c noctalia-shell call volume muteInput
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, T, Activity, exec, omarchy-launch-tui btop
#bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus ^signal$ "uwsm-app -- signal-desktop"
bindd = SUPER SHIFT, W, Typora, exec, uwsm-app -- typora --enable-wayland-ime
bindd = SUPER SHIFT, C, activewindow, exec, hyprctl dispatch centerwindow
# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
# bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"

# Overwrite existing bindings
#unbind = SUPER, SPACE
#bindd = SUPER, SPACE, Noctalia launcher, exec, qs ipc -c noctalia-shell call launcher toggle
unbind = SUPER CTRL, SPACE
bindd = SUPER CTRL, SPACE, Wallpaper picker, exec, qs ipc -c noctalia-shell call wallpaper toggle
#bindd = SUPER CTRL, 3, Screenshot fullscreen to clipboard, exec, omarchy-cmd-screenshot smart clipboard
bindd = SUPER SHIFT, S, Screenshot area with editing, exec, omarchy-cmd-screenshot

bind = SUPER, D, exec, wayscriber --active

# Use Noctalia lock screen instead of hyprlock
unbind = SUPER CTRL, L
bindd = SUPER CTRL, L, Lock screen (Noctalia), exec, qs ipc -c noctalia-shell call lockScreen lock

# Layout
bindd = SUPER, L, Toggle scrolling layout, exec, hyprctl getoption general:layout -j | jq -re '.str == "scrolling"' > /dev/null && hyprctl keyword general:layout dwindle || hyprctl keyword general:layout scrolling
