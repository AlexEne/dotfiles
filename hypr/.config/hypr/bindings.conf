# Application bindings
# Terminal
bind = SUPER, RETURN, exec, uwsm-app -- ghostty
# File manager
bind = SUPER SHIFT, E, exec, uwsm-app -- nautilus --new-window
# Browser
bind = SUPER SHIFT, B, exec, uwsm-app -- firefox
# Browser (private)
bind = SUPER SHIFT ALT, B, exec, uwsm-app -- firefox --private-window
# Toggle Microphone Mute
bind = SUPER SHIFT, Z, exec, qs ipc -c noctalia-shell call volume muteInput
# Editor
bind = SUPER SHIFT, N, exec, uwsm-app -- ghostty -e nvim
# Activity (btop)
bind = SUPER SHIFT, T, exec, uwsm-app -- ghostty -e btop
# Signal
bind = SUPER SHIFT, G, exec, uwsm-app -- signal-desktop
# Center active window
bind = SUPER SHIFT, C, exec, hyprctl dispatch centerwindow

# Remove Apple Display brightness bindings
unbind = CTRL, F2
unbind = SHIFT CTRL, F2

# Wallpaper picker (overrides theme bg-next)
unbind = SUPER CTRL, SPACE
bind = SUPER CTRL, SPACE, exec, qs ipc -c noctalia-shell call wallpaper toggle

# Screenshot area with editing (always saved to ~/Pictures)
bind = SUPER SHIFT, S, exec, ~/.config/hypr/scripts/screenshot.sh

# Dictation
bind = SUPER, D, exec, wayscriber --active

# Lock screen (Noctalia, overrides hyprlock)
unbind = SUPER CTRL, L
bind = SUPER CTRL, L, exec, qs ipc -c noctalia-shell call lockScreen lock

# Layout toggle
bind = SUPER, L, exec, hyprctl getoption general:layout -j | jq -re '.str == "scrolling"' > /dev/null && hyprctl keyword general:layout dwindle || hyprctl keyword general:layout scrolling
