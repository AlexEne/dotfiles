input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = ctrl:nocaps
    kb_rules =
    follow_mouse = 1
    repeat_rate = 40
    repeat_delay = 500
    numlock_by_default = true
    sensitivity = -0.3
    accel_profile = "flat"
    touchpad {
        natural_scroll = false
        scroll_factor = 0.4
    }
}

misc {
    key_press_enables_dpms = true
    mouse_move_enables_dpms = true
}

animations {
    enabled = true
    bezier = myBezier, 0.005, 0.9, 0.1, 1.02
    bezier = quick, 0.15, 0.0, 0.1, 1.0
    animation = workspaces, 1, 2, quick, fade
}

windowrule = scroll_touchpad 2.2, match:class com.mitchellh.ghostty
