# Media keys with OSD
# swayosd-client shows popup overlays for volume, brightness, and media

bindle = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindle = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindle = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindle = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
bindle = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindle = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower

bindle = ALT, XF86AudioRaiseVolume, exec, swayosd-client --output-volume +1
bindle = ALT, XF86AudioLowerVolume, exec, swayosd-client --output-volume -1
bindle = ALT, XF86MonBrightnessUp, exec, swayosd-client --brightness +1
bindle = ALT, XF86MonBrightnessDown, exec, swayosd-client --brightness -1

bindl = , XF86AudioNext, exec, swayosd-client --playerctl next
bindl = , XF86AudioPause, exec, swayosd-client --playerctl play-pause
bindl = , XF86AudioPlay, exec, swayosd-client --playerctl play-pause
bindl = , XF86AudioPrev, exec, swayosd-client --playerctl previous

bindl = SUPER, XF86AudioMute, exec, ~/.config/hypr/scripts/audio-switch.sh
